name: CI/CD Django blog

# Коли запускати: після кожного push у гілку main
# (і вручну кнопкою на вкладці Actions)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------- Етап 1: Build ----------
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити код із GitHub
        uses: actions/checkout@v5

      - name: Встановити Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Перевірити, що проєкт Django збирається без помилок
        run: python manage.py check

  # ---------- Етап 2: Testing ----------
  test:
    name: 2. Testing
    needs: build          # стартує тільки після успішного Build
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити код із GitHub
        uses: actions/checkout@v5

      - name: Встановити Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Встановити залежності
        run: pip install -r requirements.txt

      - name: Запустити тести
        run: python manage.py test -v 2

  # ---------- Етап 3: Docker Build & Push ----------
  docker:
    name: 3. Docker Build & Push
    needs: test           # стартує тільки якщо тести пройшли
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити код із GitHub
        uses: actions/checkout@v5

      - name: Увійти в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Підготувати Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Зібрати образ за Dockerfile і відправити в Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myblog:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/myblog:${{ github.sha }}